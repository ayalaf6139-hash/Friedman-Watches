<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment - תשלום</title>
  <link rel="stylesheet" href="../styles/all.css" />
  <link rel="stylesheet" href="../styles/payment.css" />
</head>

<body>
  <header></header>

  <main class="form-wrapper">
    <section class="payment-card">
      <h1>חשבונית ותשלום</h1>

      <div id="invoice" class="invoice"></div>

      <form id="form" novalidate>
        <div class="form-group">
          <label for="paymentMethod">אמצעי תשלום</label>
          <select id="paymentMethod" name="paymentMethod"></select>
        </div>

        <fieldset class="method-fields" data-method="credit">
          <div class="form-group">
            <label for="cardNumber">מספר כרטיס</label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" inputmode="numeric" />
          </div>

          <div class="form-group">
            <label for="expiry">תוקף</label>
            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" />
          </div>

          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="123" inputmode="numeric" />
          </div>

          <div class="form-group">
            <label for="holder">שם של בעל הכרטיס</label>
            <input type="text" id="holder" name="holder" placeholder="הכנס שם מלא" />
          </div>

          <div class="form-group">
            <label for="idNumber">תעודת זהות של בעל הכרטיס</label>
            <input type="text" id="idNumber" name="idNumber" placeholder="123456789" inputmode="numeric" />
          </div>
        </fieldset>

        <fieldset class="method-fields" data-method="bit">
          <div class="form-group">
            <label for="bitPhone">מספר טלפון נייד לחיוב ב-BIT</label>
            <input type="tel" id="bitPhone" name="bitPhone" placeholder="050-1234567" />
          </div>
        </fieldset>

        <fieldset class="method-fields" data-method="cash">
          <p class="method-note">התשלום במזומן יתבצע בעת איסוף ההזמנה מהחנות.</p>
        </fieldset>

        <fieldset class="method-fields" data-method="check">
          <div class="form-group">
            <label for="checkNumber">מספר צ'ק</label>
            <input type="text" id="checkNumber" name="checkNumber" placeholder="0001234" inputmode="numeric" />
          </div>
          <div class="form-group">
            <label for="dueDate">תאריך פירעון</label>
            <input type="date" id="dueDate" name="dueDate" />
          </div>
        </fieldset>

        <fieldset class="method-fields" data-method="transfer">
          <p class="method-note">יש להעביר את הסכום לחשבון החברה ולמלא את פרטי החשבון ממנו בוצעה ההעברה.</p>
          <div class="form-group">
            <label for="bank">מספר בנק</label>
            <input type="text" id="bank" name="bank" placeholder="12" inputmode="numeric" />
          </div>
          <div class="form-group">
            <label for="branch">מספר סניף</label>
            <input type="text" id="branch" name="branch" placeholder="345" inputmode="numeric" />
          </div>
          <div class="form-group">
            <label for="account">מספר חשבון</label>
            <input type="text" id="account" name="account" placeholder="123456" inputmode="numeric" />
          </div>
        </fieldset>

        <button type="submit" class="submit-btn">בצע תשלום</button>
      </form>

      <p id="payment-message" class="message"></p>
    </section>
  </main>

  <footer></footer>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/ls.js"></script>
  <script src="../scripts/chatbot.js"></script>
  <script src="../scripts/services.js"></script>
  <script src="../scripts/ui.js"></script>
  <script src="../scripts/header-footer.js"></script>
  <script src="../scripts/payment.js"></script>
</body>

</html>
